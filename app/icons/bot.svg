<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 100 100">
  <!-- Panda head -->
  <circle cx="50" cy="50" r="35" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Left ear -->
  <circle cx="25" cy="22" r="12" fill="#1a1a1a"/>
  <!-- Right ear -->
  <circle cx="75" cy="22" r="12" fill="#1a1a1a"/>
  <!-- Left eye patch -->
  <ellipse cx="37" cy="48" rx="10" ry="12" fill="#1a1a1a"/>
  <!-- Right eye patch -->
  <ellipse cx="63" cy="48" rx="10" ry="12" fill="#1a1a1a"/>
  <!-- Left eye -->
  <circle cx="37" cy="48" r="4" fill="#ffffff"/>
  <!-- Right eye -->
  <circle cx="63" cy="48" r="4" fill="#ffffff"/>
  <!-- Nose -->
  <ellipse cx="50" cy="60" rx="4" ry="3" fill="#1a1a1a"/>
  <!-- Smile -->
  <path d="M 44 65 Q 50 71 56 65" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
</svg>
