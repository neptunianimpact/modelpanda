<svg xmlns="http://www.w3.org/2000/svg" width="43" height="43" viewBox="0 0 100 100">
  <!-- Panda body -->
  <ellipse cx="50" cy="62" rx="28" ry="25" fill="#1a1a1a"/>
  <!-- Panda belly -->
  <ellipse cx="50" cy="65" rx="18" ry="17" fill="#ffffff"/>
  <!-- Panda head -->
  <circle cx="50" cy="38" r="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
  <!-- Left ear -->
  <circle cx="34" cy="20" r="9" fill="#1a1a1a"/>
  <!-- Right ear -->
  <circle cx="66" cy="20" r="9" fill="#1a1a1a"/>
  <!-- Left eye patch -->
  <ellipse cx="41" cy="37" rx="8" ry="9" fill="#1a1a1a"/>
  <!-- Right eye patch -->
  <ellipse cx="59" cy="37" rx="8" ry="9" fill="#1a1a1a"/>
  <!-- Left eye -->
  <circle cx="41" cy="37" r="3" fill="#ffffff"/>
  <!-- Right eye -->
  <circle cx="59" cy="37" r="3" fill="#ffffff"/>
  <!-- Nose -->
  <ellipse cx="50" cy="45" rx="3" ry="2.5" fill="#1a1a1a"/>
  <!-- Smile -->
  <path d="M 46 48 Q 50 52 54 48" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Light bulb above head -->
  <circle cx="50" cy="8" r="5" fill="none" stroke="#22C55E" stroke-width="1.5"/>
  <line x1="50" y1="3" x2="50" y2="1" stroke="#22C55E" stroke-width="1.2"/>
  <line x1="45" y1="5" x2="43" y2="3" stroke="#22C55E" stroke-width="1.2"/>
  <line x1="55" y1="5" x2="57" y2="3" stroke="#22C55E" stroke-width="1.2"/>
  <!-- Sparkles -->
  <path d="M 38 8 l 1 -2 l 1 2 l -1 2 z" fill="#22C55E"/>
  <path d="M 62 8 l 1 -2 l 1 2 l -1 2 z" fill="#22C55E"/>
</svg>
